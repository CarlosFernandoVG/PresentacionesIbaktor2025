<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Query Demo</title>
<style>
  /* Estilo base (Mobile First) */
  .box {
    width: 80%;
    height: 200px;
    background-color: lightblue;
    margin: 20px auto;
    text-align: center;
    line-height: 200px;
    font-weight: bold;
    font-size: 1.5rem;
    transition: all 0.3s ease; /* transición suave */
  }

  /* Media query para pantallas menores a 768px */
  @media (max-width: 768px) {
    .box {
      background-color: red !important;
      height: 150px !important;
      line-height: 150px !important;
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>

<div class="box">Caja adaptable</div>

</body>
</html>
