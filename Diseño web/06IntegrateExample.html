<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Responsive</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Foundation CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css">

<style>
/* Tipografía y colores base (Mobile First) */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}
header {
  background-color: lightgreen;
  text-align: center;
  padding: 1em;
  font-size: 1.2rem;
}

/* Grid y layout base para móvil */
.product {
  background-color: lightblue;
  margin: 10px;
  padding: 20px;
  text-align: center;
}

/* Desktop First ajuste mediante media query */
@media (min-width: 1024px) {
  header {
    background-color: lightcoral;
    font-size: 1.8rem;
    padding: 2em;
  }
  .product {
    padding: 40px;
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>

<header>
  <h1>Catálogo de Productos</h1>
</header>

<h2 class="text-center my-4">Sección Bootstrap</h2>
<div class="container">
  <div class="row">
    <div class="col-md-4 col-sm-12 product">Producto 1</div>
    <div class="col-md-4 col-sm-12 product">Producto 2</div>
    <div class="col-md-4 col-sm-12 product">Producto 3</div>
  </div>
</div>

<h2 class="text-center my-4">Sección Foundation</h2>
<div class="grid-container">
  <div class="grid-x grid-margin-x">
    <div class="cell small-12 medium-4 product">Producto A</div>
    <div class="cell small-12 medium-4 product">Producto B</div>
    <div class="cell small-12 medium-4 product">Producto C</div>
  </div>
</div>

</body>
</html>
