<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundation Demo</title>

<!-- Foundation CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css">

<style>
  /* Estilos adicionales para visibilidad */
  .cell {
    text-align: center;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="grid-container my-4">
  <div class="grid-x grid-margin-x">
    <div class="cell small-12 medium-4 bg-primary text-white p-2">Celda 1</div>
    <div class="cell small-12 medium-4 bg-success text-white p-2">Celda 2</div>
    <div class="cell small-12 medium-4 bg-danger text-white p-2">Celda 3</div>
  </div>
</div>

</body>
</html>
