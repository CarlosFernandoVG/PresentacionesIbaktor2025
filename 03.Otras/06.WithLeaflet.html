<!DOCTYPE html>
<html>
<head>
    <title>Dos mapas con Leaflet</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Estilos para los contenedores de los mapas */
        .map-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .mapa {
            height: 400px;
            width: 45%;
            margin: 10px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Dos Mapas con Leaflet</h1>
    
    <div class="map-container">
        <div>
            <h2>Mapa 1: Marcador Interactivo</h2>
            <div id="mapa1" class="mapa"></div>
        </div>
        
        <div>
            <h2>Mapa 2: Capas de Círculos y Polilíneas</h2>
            <div id="mapa2" class="mapa"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- Mapa 1: Marcador Interactivo ---
        var mapa1 = L.map('mapa1').setView([40.7128, -74.0060], 13); // Nueva York
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mapa1);

        // Añadir un marcador que abre un pop-up
        var marcador = L.marker([40.7128, -74.0060]).addTo(mapa1);
        marcador.bindPopup("<b>¡Hola!</b><br>Estoy en Nueva York.").openPopup();

        // --- Mapa 2: Círculos y Polilíneas ---
        var mapa2 = L.map('mapa2').setView([48.8566, 2.3522], 12); // París
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mapa2);

        // Añadir un círculo
        var circulo = L.circle([48.8566, 2.3522], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 500
        }).addTo(mapa2).bindPopup("Aquí está la Torre Eiffel.");

        // Añadir una polilínea (un camino)
        var latlngs = [
            [48.8584, 2.2945], // Torre Eiffel
            [48.8606, 2.3376], // Museo del Louvre
            [48.8601, 2.3571]  // Notre-Dame
        ];
        var polyline = L.polyline(latlngs, {color: 'blue'}).addTo(mapa2);

        // Ajustar el mapa para que se vean todos los puntos de la polilínea
        mapa2.fitBounds(polyline.getBounds());
    </script>

</body>
</html>
