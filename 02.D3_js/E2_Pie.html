<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gráfico de Pie con D3.js</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      text-align: center;
    }
    .slice text {
      font-size: 12px;
      fill: white;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h2>Gráfico de Pie con D3.js</h2>
  <svg width="400" height="400"></svg>

  <script>
    const data = [
      { label: "Electrónica", value: 30 },
      { label: "Ropa", value: 15 },
      { label: "Alimentos", value: 40 },
      { label: "Hogar", value: 15 }
    ];

    const width = 400,
          height = 400,
          radius = Math.min(width, height) / 2;

    const svg = d3.select("svg")
                  .attr("width", width)
                  .attr("height", height)
                  .append("g")
                  .attr("transform", `translate(${width / 2},${height / 2})`);

    const color = d3.scaleOrdinal()
                    .domain(data.map(d => d.label))
                    .range(d3.schemeCategory10);

    const pie = d3.pie()
                  .value(d => d.value);

    const arc = d3.arc()
                  .innerRadius(0)
                  .outerRadius(radius - 10);

    const arcs = svg.selectAll("g.slice")
                    .data(pie(data))
                    .join("g")
                    .attr("class", "slice");

    arcs.append("path")
        .attr("d", arc)
        .attr("fill", d => color(d.data.label));

    // Añadir etiquetas en el centro de cada slice
    arcs.append("text")
        .attr("transform", d => `translate(${arc.centroid(d)})`)
        .attr("text-anchor", "middle")
        .text(d => d.data.label);
  </script>
</body>
</html>
