<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Avanzado con Map Highlight</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { font-family: Arial; margin: 20px; background: #f4f6f8; }
h1 { text-align: center; }

.filters { display: flex; justify-content: center; gap: 20px; margin: 20px; flex-wrap: wrap; }
.kpi-container { display: flex; justify-content: space-around; margin: 20px 0; flex-wrap: wrap; }
.kpi { background: white; padding: 20px; border-radius: 10px; width: 20%; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px 0; }

.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 20px; width: 80%; margin: auto; }
.chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
#map { grid-column: 1 / -1; height: 400px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

.button-reset { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
.button-reset:hover { background: #0056b3; }
</style>
</head>
<body>

<h1>📊 Dashboard Avanzado con Map Highlight</h1>

<div class="filters">
  <label>Selecciona archivo JSON:
    <input type="file" id="fileInput" accept=".json"/>
  </label>
  <button class="button-reset" onclick="resetFiltros()">Reset Filtros</button>
</div>

<div class="filters">
  <label>Desde:
    <input type="date" id="fechaInicio">
  </label>
  <label>Hasta:
    <input type="date" id="fechaFin">
  </label>
  <button onclick="aplicarFiltros()">Aplicar Filtros</button>
</div>

<div class="kpi-container">
  <div class="kpi"><h2 id="total-ventas">0</h2><p>Ventas Totales</p></div>
  <div class="kpi"><h2 id="unidades">0</h2><p>Unidades Vendidas</p></div>
  <div class="kpi"><h2 id="ticket">0</h2><p>Ticket Promedio</p></div>
  <div class="kpi"><h2 id="producto">-</h2><p>Producto más Vendido</p></div>
</div>

<div class="dashboard-grid">
  <div class="chart-container">
    <canvas id="ventasDiarias"></canvas>
  </div>
  <div class="chart-container">
    <canvas id="ventasProducto"></canvas>
  </div>
  <div id="map"></div>
</div>

<script>
let datosOriginales = [];
let chartDiarias, chartProducto;
let map, markers = [];
let productosSeleccionados = [];

// Inicializar mapa
map = L.map('map').setView([23.6345, -102.5528], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

// --- CARGAR ARCHIVO ---
document.getElementById("fileInput").addEventListener("change", function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      datosOriginales = JSON.parse(e.target.result);
      productosSeleccionados = [];
      actualizarDashboard(datosOriginales);
    } catch(err){ alert("Error al leer JSON: " + err); }
  };
  reader.readAsText(file);
});

// --- FILTROS ---
function aplicarFiltros(){
  const inicio = document.getElementById("fechaInicio").value;
  const fin = document.getElementById("fechaFin").value;

  let filtrados = datosOriginales;
  if(inicio) filtrados = filtrados.filter(d=>d.fecha >= inicio);
  if(fin) filtrados = filtrados.filter(d=>d.fecha <= fin);
  if(productosSeleccionados.length > 0){
    filtrados = filtrados.filter(d=>productosSeleccionados.includes(d.producto));
  }

  actualizarDashboard(filtrados);
}

// --- RESET ---
function resetFiltros(){
  productosSeleccionados = [];
  document.getElementById("fechaInicio").value = '';
  document.getElementById("fechaFin").value = '';
  actualizarDashboard(datosOriginales);
}

// --- ACTUALIZAR DASHBOARD ---
function actualizarDashboard(data){
  if(data.length === 0){ alert("No hay datos con los filtros seleccionados."); return; }

  // KPIs
  const totalVentas = data.reduce((acc,d)=>acc+d.ingreso,0);
  const unidades = data.reduce((acc,d)=>acc+d.cantidad,0);
  const ticket = totalVentas / data.length;
  const prodMap = {};
  data.forEach(d=>prodMap[d.producto]=(prodMap[d.producto]||0)+d.cantidad);
  const productoMasVendido = Object.entries(prodMap).sort((a,b)=>b[1]-a[1])[0][0];

  document.getElementById("total-ventas").textContent = "$" + totalVentas.toFixed(2);
  document.getElementById("unidades").textContent = unidades;
  document.getElementById("ticket").textContent = "$" + ticket.toFixed(2);
  document.getElementById("producto").textContent = productoMasVendido;

  // Gráfica 1: Ventas diarias con fechas legibles
  const ventasPorDia = {};
  data.forEach(d=>{
    const fecha = new Date(d.fecha).toISOString().split('T')[0];
    ventasPorDia[fecha] = (ventasPorDia[fecha]||0) + d.ingreso;
  });
  if(chartDiarias) chartDiarias.destroy();
  chartDiarias = new Chart(document.getElementById("ventasDiarias"),{
    type:"line",
    data:{ labels:Object.keys(ventasPorDia), datasets:[{label:"Ventas por Día", data:Object.values(ventasPorDia), borderColor:"blue", fill:false}] }
  });

  // Gráfica 2: Ventas por producto con cross-filtering
  const ventasProducto = {};
  datosOriginales.forEach(d=>ventasProducto[d.producto]=(ventasProducto[d.producto]||0)+d.ingreso);

  if(!chartProducto){
    chartProducto = new Chart(document.getElementById("ventasProducto"),{
      type:"bar",
      data:{ labels:Object.keys(ventasProducto), datasets:[{label:"Ventas por Producto", data:Object.values(ventasProducto), backgroundColor:"orange"}] },
      options:{ onClick: (e, elements)=>{
        if(elements.length>0){
          const idx = elements[0].index;
          const producto = chartProducto.data.labels[idx];
          if(productosSeleccionados.includes(producto)){
            productosSeleccionados = productosSeleccionados.filter(p=>p!==producto);
          } else {
            productosSeleccionados.push(producto);
          }
          aplicarFiltros();
        }
      }}
    });
  } else {
    chartProducto.data.datasets[0].data = Object.keys(ventasProducto).map(p=>{
      return productosSeleccionados.includes(p)? ventasProducto[p]: ventasProducto[p]*0.5;
    });
    chartProducto.update();
  }

  // Mapa con resaltado dinámico
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  const ventasPorCiudad = {};
  data.forEach(d=>{
    ventasPorCiudad[d.ciudad] = ventasPorCiudad[d.ciudad]||{total:0, lat:d.lat, lon:d.lon};
    ventasPorCiudad[d.ciudad].total += d.ingreso;
  });

  // Resaltar según productos seleccionados
  const todasCiudades = {};
  datosOriginales.forEach(d=>{
    todasCiudades[d.ciudad] = todasCiudades[d.ciudad]||{lat:d.lat, lon:d.lon};
  });

  for(const [ciudad, info] of Object.entries(todasCiudades)){
    const total = ventasPorCiudad[ciudad]? ventasPorCiudad[ciudad].total : 0;
    const color = total>0 ? 'blue' : 'gray'; // atenuado si no hay ventas
    const opacity = total>0 ? 1 : 0.3;
    const marker = L.circleMarker([info.lat, info.lon], { radius: 10, color: color, fillOpacity: opacity }).addTo(map)
      .bindPopup(`<b>${ciudad}</b><br>Ventas: $${total.toFixed(2)}`);
    markers.push(marker);
  }
}
</script>
</body>
</html>
